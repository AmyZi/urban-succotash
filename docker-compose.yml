services:
  frontend:
    build:
      context: ./braidsinboras
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      WORDPRESS_API_URL: http://wordpress/graphql
      NEXT_PUBLIC_WP_GRAPHQL_URL: http://wordpress/graphql
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - wordpress

  wordpress:
    image: wordpress:latest
    platform: linux/amd64
    ports:
      - "8080:80"
    volumes:
      - ./wp-content:/var/www/html/wp-content
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: password
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('JWT_AUTH_SECRET_KEY', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsIm5hbWUiOiJhbWkiLCJpYXQiOjE3NzIzNzIwMDYsImV4cCI6MTkzMDA1MjAwNn0.fUDxDkoTXc41FBBCqg6k8yNJC1qe5cpD8vvZf-NhAnAO');
        define('JWT_AUTH_CORS_ENABLE', true);
    depends_on:
      - db

  db:
    image: mariadb:10.11
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: password
    volumes:
      - ./db_data:/var/lib/mysql